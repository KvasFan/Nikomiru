# Nikomiru license policy: SPECIFICATION §3.2 and §3.5.
#
# - [licenses].allow      = class A, always allowed.
# - [licenses].exceptions = class B, unavoidable exceptions (ICU family, foldhash,
#   libloading), ONLY for the listed crates. The list must match the table of
#   SPECIFICATION §3.2: `cargo xtask ci` checks it (T-LIC-001). Every addition requires
#   an updated table and the explicit approval of the maintainer (decisions D-1, D-10,
#   D-13).

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[output]
feature-depth = 1

[advisories]
yanked = "deny"
# Not vulnerabilities: crates merged into zbus 6, reached only through AccessKit's
# AT-SPI stack (accesskit_unix → atspi → zbus 5), which has no zbus 6 release yet.
# Revisit on every update of egui and AccessKit (D-13).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6: through accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6: through accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6: through accesskit_unix" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.93
# Class A is declared in full even though not all of its licenses are in the graph today.
unused-allowed-license = "allow"
# The class B exceptions apply to the complete graph: an exception that is no longer
# used is reported, so it can be removed (SPECIFICATION §3.2, rule 4).
unused-license-exception = "warn"
exceptions = [
    # Unicode-3.0 — url → idna (reqwest); icu_normalizer (direct, §4); proc-macro2
    # (every procedural macro: serde_derive, thiserror, zbus through AccessKit)
    { crate = "icu_collections", allow = ["Unicode-3.0"] },
    { crate = "icu_locale_core", allow = ["Unicode-3.0"] },
    { crate = "icu_normalizer", allow = ["Unicode-3.0"] },
    { crate = "icu_normalizer_data", allow = ["Unicode-3.0"] },
    { crate = "icu_provider", allow = ["Unicode-3.0"] },
    { crate = "litemap", allow = ["Unicode-3.0"] },
    { crate = "tinystr", allow = ["Unicode-3.0"] },
    { crate = "writeable", allow = ["Unicode-3.0"] },
    { crate = "yoke", allow = ["Unicode-3.0"] },
    { crate = "yoke-derive", allow = ["Unicode-3.0"] },
    { crate = "zerofrom", allow = ["Unicode-3.0"] },
    { crate = "zerofrom-derive", allow = ["Unicode-3.0"] },
    { crate = "zerotrie", allow = ["Unicode-3.0"] },
    { crate = "zerovec", allow = ["Unicode-3.0"] },
    { crate = "zerovec-derive", allow = ["Unicode-3.0"] },
    { crate = "potential_utf", allow = ["Unicode-3.0"] },
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    # Zlib — hashbrown's default hasher (fontique, AccessKit, epaint), glifo (epaint)
    { crate = "foldhash", allow = ["Zlib"] },
    # ISC — glutin and the libraries winit loads at run time (D-13)
    { crate = "libloading", allow = ["ISC"] },
]

# `libmpv2` and `libmpv2-sys` declare "LGPL-2.1", a deprecated SPDX identifier
# equivalent to LGPL-2.1-only; the LICENSE file is the LGPL 2.1 text without the
# "or later" clause. It is class A: it is clarified, not excepted.
[[licenses.clarify]]
crate = "libmpv2"
expression = "LGPL-2.1-only"
license-files = []

[[licenses.clarify]]
crate = "libmpv2-sys"
expression = "LGPL-2.1-only"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # SPECIFICATION §3.6: alternatives chosen to stay within the policy.
    { crate = "xxhash-rust", reason = "BSL-1.0: use twox-hash or the redb hasher" },
    { crate = "encoding_rs", reason = "includes BSD-3-Clause: glibc iconv via FFI" },
    { crate = "rustls", reason = "ring is ISC: TLS with native-tls → OpenSSL" },
    { crate = "ring", reason = "ISC: TLS with native-tls → OpenSSL" },
    { crate = "notify", reason = "CC0-1.0: manual rescan or inotify via libc" },
    { crate = "directories", reason = "pulls option-ext (MPL-2.0): own XDG code in nikomiru-core (§3.6)" },
    { crate = "subparse", reason = "MPL-2.0: own subtitle parsers" },
    { crate = "anitomy", reason = "MPL-2.0: own file name parser" },
    { crate = "zstd-sys", reason = "BSD-3 / GPL-2.0-only: use lz4_flex" },
    { crate = "libsqlite3-sys", reason = "SQLite is public domain (not on the list): redb, turso" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
