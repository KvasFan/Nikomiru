[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The M0 spikes are separate workspaces: their code is thrown away (ROADMAP M0).
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

# Versions verified on crates.io on 2026-10-19 (SPECIFICATION §4).
# Every new crate requires, in its PR, the license, a rationale and an evaluated alternative.
[workspace.dependencies]
# Workspace crates
nikomiru-core = { path = "crates/nikomiru-core" }
nikomiru-text = { path = "crates/nikomiru-text" }
nikomiru-dict = { path = "crates/nikomiru-dict" }
nikomiru-subs = { path = "crates/nikomiru-subs" }
nikomiru-media = { path = "crates/nikomiru-media" }
nikomiru-player = { path = "crates/nikomiru-player" }
nikomiru-anki = { path = "crates/nikomiru-anki" }
nikomiru-library = { path = "crates/nikomiru-library" }
nikomiru-online = { path = "crates/nikomiru-online" }
nikomiru-ui = { path = "crates/nikomiru-ui" }

# mpv core (nikomiru-player only, ARC-010). libmpv2-sys, already in the graph through
# libmpv2, for the render context (libmpv2 6.0 ties it to a borrow of the core).
libmpv2 = { version = "6.0.0", features = ["render"] }
libmpv2-sys = "4.0.1"

# UI: egui on winit + glutin (EGL first, for zero-copy VA-API on X11 too) + egui_glow
# (nikomiru-ui and nikomiru-app only; ARC-010, D-13, ADR 0006). No bundled fonts
# (SPECIFICATION §3.4): the system's, found through fontique. No `links` feature: the UI
# opens no URL on its own. No Adwaita decorations: they need tiny-skia (BSD-3).
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "wayland", "x11"] }
egui_glow = { version = "0.37", default-features = false, features = ["winit", "clipboard", "wayland", "x11"] }
egui_system_font_provider = "0.37"
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
glow = "0.17"
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "wayland", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
raw-window-handle = "0.6"
# Images of dictionary entries (POP-010), decoded on the lookup thread: the formats
# Qt's plugins read, without SVG and AVIF (no class A decoder).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Drag and drop on Wayland, which winit 0.30 lacks: a data device on winit's own
# connection (nikomiru-app only). Both are already in the graph through winit.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

# Logic
tokio = "1.53"
redb = "4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
lz4_flex = "0.14"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
icu_normalizer = "2.3"
unicode-segmentation = "1.13"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
fluent-bundle = "0.16"
unic-langid = "0.9"
uuid = "1.28"
sha2 = "0.11"
md4 = "0.11"
regex = "1.13"
libc = "0.2.191"

# Test
proptest = "1.12"
insta = "1.49"
criterion = "0.8"
wiremock = "0.6"
tempfile = "3.27"
# UI tests of the egui views through AccessKit: no renderer, no wgpu.
egui_kittest = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# ERR-002: no unwrap/expect on external input. They are allowed in tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

# Dictionary hot paths, optimized in development builds too: unoptimized redb
# takes seconds to open a 350 MB dictionary (Jitendex), which hides real
# timings in the GUI tests.
[profile.dev.package.redb]
opt-level = 3
debug-assertions = false

[profile.dev.package.lz4_flex]
opt-level = 3

[profile.dev.package.postcard]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo xtask` runs with this profile: it generates fixtures of hundreds of MB, so
# optimizing pays off; its directory is separate from the development builds.
[profile.xtask]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
