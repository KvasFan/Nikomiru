[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The M0 spikes are separate workspaces: their code is thrown away (ROADMAP M0).
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

# Versions verified on crates.io on 2026-10-19 (SPECIFICATION §4).
# Every new crate requires, in its PR, the license, a rationale and an evaluated alternative.
[workspace.dependencies]
# Workspace crates
anikoto-core = { path = "crates/anikoto-core" }
anikoto-text = { path = "crates/anikoto-text" }
anikoto-dict = { path = "crates/anikoto-dict" }
anikoto-subs = { path = "crates/anikoto-subs" }
anikoto-media = { path = "crates/anikoto-media" }
anikoto-player = { path = "crates/anikoto-player" }
anikoto-anki = { path = "crates/anikoto-anki" }
anikoto-library = { path = "crates/anikoto-library" }
anikoto-online = { path = "crates/anikoto-online" }
anikoto-ui = { path = "crates/anikoto-ui" }

# UI and composition (anikoto-ui / anikoto-app only, ARC-010)
dioxus = { version = "0.7.10", default-features = false }
gtk = "0.18"
glib = "0.18"
gdk = "0.18"

# Video (anikoto-player only, ARC-010)
libmpv2 = { version = "6.0.0", features = ["render"] }

# Logic
tokio = "1.53"
redb = "4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
lz4_flex = "0.14"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
icu_normalizer = "2.3"
unicode-segmentation = "1.13"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
directories = "6.0"
rfd = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
uuid = "1.28"
sha2 = "0.11"
md4 = "0.11"
regex = "1.13"

# Test
proptest = "1.12"
insta = "1.49"
criterion = "0.8"
wiremock = "0.6"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# ERR-002: no unwrap/expect on external input. They are allowed in tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo xtask` runs with this profile: it generates fixtures of hundreds of MB, so
# optimizing pays off; its directory is separate from the development builds.
[profile.xtask]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
