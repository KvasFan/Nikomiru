[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.180.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

# Versions verified on crates.io on 2026-10-19 (SPECIFICATION §4).
# Every new crate requires, in its PR, the license, a rationale and an evaluated alternative.
[workspace.dependencies]
# The keyring (MET-005)
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
# Workspace crates
nikomiru-core = { path = "crates/nikomiru-core" }
nikomiru-text = { path = "crates/nikomiru-text" }
nikomiru-books = { path = "crates/nikomiru-books" }
nikomiru-ocr = { path = "crates/nikomiru-ocr" }
nikomiru-dict = { path = "crates/nikomiru-dict" }
nikomiru-subs = { path = "crates/nikomiru-subs" }
nikomiru-media = { path = "crates/nikomiru-media" }
nikomiru-player = { path = "crates/nikomiru-player" }
nikomiru-anki = { path = "crates/nikomiru-anki" }
nikomiru-library = { path = "crates/nikomiru-library" }
nikomiru-online = { path = "crates/nikomiru-online" }
nikomiru-ui = { path = "crates/nikomiru-ui" }

# mpv core (nikomiru-player only, ARC-010). libmpv2-sys, already in the graph through
# libmpv2, for the render context (libmpv2 6.0 ties it to a borrow of the core).
libmpv2 = { version = "6.0.0", features = ["render"] }
libmpv2-sys = "4.0.1"

# UI: egui on winit + glutin (EGL first, for zero-copy VA-API on X11 too) + egui_glow
# (nikomiru-ui and nikomiru-app only; ARC-010, D-13, ADR 0006). No bundled fonts
# (SPECIFICATION §3.4): the system's, found through fontique. No `links` feature: the UI
# opens no URL on its own. No Adwaita decorations: they need tiny-skia (BSD-3).
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["accesskit", "clipboard"] }
egui_glow = { version = "0.37", default-features = false, features = ["winit", "clipboard"] }
egui_system_font_provider = "0.37"
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
glow = "0.17"
glutin = { version = "0.32", default-features = false }
glutin-winit = { version = "0.5", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
# Windows system calls of the app's `windows` platform module (ADR 0009); already in
# the graph through winit
windows-sys = "0.61"
# Images of dictionary entries (POP-010), decoded on the lookup thread: the formats
# Qt's plugins read, without SVG and AVIF (no class A decoder).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Drag and drop on Wayland, which winit 0.30 lacks: a data device on winit's own
# connection (nikomiru-app only). Both are already in the graph through winit.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
# The L6 drag source: a layer-shell surface and KWin's fake input (tests only)
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# Logic
tokio = "1.53"
redb = "4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
lz4_flex = "0.14"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
# Android (D-16): native-tls is OpenSSL there too, built with the app (`vendored`, Apache-2.0)
openssl = "0.10"
# Android (D-16): links and settings opened through Java (MIT OR Apache-2.0; already in the graph through android-activity)
jni = "0.22"
icu_normalizer = "2.3"
unicode-segmentation = "1.13"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
fluent-bundle = "0.16"
unic-langid = "0.9"
uuid = "1.28"
sha2 = "0.11"
# Encrypted sync (BAK-012, §4): XChaCha20-Poly1305 and Argon2id from RustCrypto, MIT OR Apache-2.0
chacha20poly1305 = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.3"
# Update manifest signatures (UPD-001, §4): minisign/Ed25519 verification, MIT, no dependencies
minisign-verify = "0.3"
# Signing in the update tests only (UPD-001): MIT, without default features
ed25519-compact = { version = "2.6", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
# Inert namespace-aware DOCX body parsing (DOC-003); already in the graph.
quick-xml = { version = "0.41.0", default-features = false }
crc32fast = "1.5"
# the manga model, in pure Rust (D-30)
tract-onnx = "0.23"
# the same version as tract-onnx's: matrix products on several threads (MNG-003)
tract-linalg = { version = "=0.23.9", features = ["multithread-mm"] }
md4 = "0.11"
regex = "1.13"
libc = "0.2.191"

# Test
proptest = "1.12"
insta = "1.49"
criterion = "0.8"
wiremock = "0.6"
tempfile = "3.27"
# UI tests of the egui views through AccessKit: no renderer, no wgpu.
egui_kittest = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# ERR-002: no unwrap/expect on external input. They are allowed in tests (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

# Dictionary hot paths, optimized in development builds too: unoptimized redb
# takes seconds to open a 350 MB dictionary (Jitendex), which hides real
# timings in the GUI tests.
[profile.dev.package.redb]
opt-level = 3
debug-assertions = false

# Argon2id (BAK-012): unoptimised, one key would take seconds in the tests
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.lz4_flex]
opt-level = 3

[profile.dev.package.postcard]
opt-level = 3

# The OCR models run on tract: unoptimised, a manga page takes a minute
# instead of seconds, in the tests and in a development build (MNG-011).
[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.tract-extra]
opt-level = 3

[profile.dev.package.tract-hir]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-nnef]
opt-level = 3

[profile.dev.package.tract-onnx]
opt-level = 3

[profile.dev.package.tract-onnx-opl]
opt-level = 3

[profile.dev.package.tract-transformers]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo xtask` runs with this profile: it generates fixtures of hundreds of MB, so
# optimizing pays off; its directory is separate from the development builds.
[profile.xtask]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
