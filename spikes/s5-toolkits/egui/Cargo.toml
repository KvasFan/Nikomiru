[package]
name = "spike-s5-egui"
description = "Spike S5: the video overlay and the dictionary popup with egui (eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
s5-common.workspace = true
serde_json.workspace = true
# eframe's defaults a shipping app needs (accessibility, clipboard, system
# fonts, links), on OpenGL instead of wgpu
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "clipboard", "system_fonts", "links"] }
