# Spike S5: the same video overlay and dictionary popup as Nikomiru's Qt
# Quick UI, written with iced and with egui (eframe), to compare performance.
# Standalone workspace: spike code does not enter crates/ (ROADMAP M0).
[workspace]
resolver = "3"
members = ["common", "iced", "egui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
s5-common = { path = "common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13"

[profile.release]
debug = "line-tables-only"
