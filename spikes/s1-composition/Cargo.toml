[package]
name = "spike-s1-composition"
description = "Spike S1 (ROADMAP M0): GtkOverlay with an mpv GLArea and a transparent Dioxus webview"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Standalone workspace: spike code does not go into crates/ (ROADMAP M0).
[workspace]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "macro", "html", "signals", "hooks"] }
# The same versions used by tao 0.34 / wry 0.53 inside dioxus-desktop 0.7.10.
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
libmpv2 = { version = "6.0.0", features = ["render"] }
futures-channel = "0.3"
futures-util = "0.3"
serde_json = "1.0.154"

[profile.release]
debug = "line-tables-only"
