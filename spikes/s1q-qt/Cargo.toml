[package]
name = "spike-s1q-qt"
description = "Spike S1q (ROADMAP M0): Qt 6 Quick UI with an mpv video item, from Rust through cxx-qt"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Standalone workspace: spike code does not enter crates/ (ROADMAP M0).
[workspace]

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
debug = "line-tables-only"
