[package]
name = "nikomiru-dict"
description = "Yomitan import, redb storage, deinflection, lookup and word audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# MemStore, an in-memory DictStore for the L1 lookup tests
test-support = []

[dependencies]
nikomiru-core.workspace = true
nikomiru-text.workspace = true
redb.workspace = true
postcard.workspace = true
lz4_flex.workspace = true
zip.workspace = true
# the pure-Rust deflate backend for zip (SPECIFICATION §4)
flate2.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
nikomiru-dict = { path = ".", features = ["test-support"] }
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
