[package]
name = "nikomiru-online"
description = "Online services: subtitles from Jimaku and OpenSubtitles; AniList and Jikan metadata later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake Jimaku and OpenSubtitles of the tests (`nikomiru_online::fake`).
test-support = []

[dependencies]
nikomiru-core.workspace = true
nikomiru-text.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
zip.workspace = true
# the pure-Rust deflate backend for zip (SPECIFICATION §4)
flate2.workspace = true

[dev-dependencies]
nikomiru-online = { path = ".", features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
