[package]
name = "nikomiru-player"
description = "mpv core (libmpv2) and the Qt Quick video item: properties, commands, events and rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "nikomiru_player"

[dependencies]
nikomiru-core.workspace = true
libmpv2.workspace = true
thiserror.workspace = true
tracing.workspace = true
cxx.workspace = true
cxx-qt.workspace = true

[features]
# Synchronous property reads (`PlayerHandle::property_string`), for the tests and
# the GUI harness only: the UI reads state from events (ARC-003, T-ARC-003).
test-support = []

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
# the L5 tests read properties back
nikomiru-player = { path = ".", features = ["test-support"] }

[lints]
workspace = true
