[package]
name = "nikomiru-player"
description = "mpv core (libmpv2): properties, commands, events and the OpenGL render context of the video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nikomiru-core.workspace = true
libmpv2.workspace = true
libmpv2-sys.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Synchronous property reads (`PlayerHandle::property_string`), for the tests and
# the GUI harness only: the UI reads state from events (ARC-003, T-ARC-003).
test-support = []

[dev-dependencies]
# the L5 tests read properties back
nikomiru-player = { path = ".", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
