[package]
name = "nikomiru-app"
description = "Nikomiru: video player for language learning with subtitles, dictionaries and Anki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nikomiru"
path = "src/main.rs"

# L6 (TEST §2): the real binary driven by the GUI test harness.
[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"
required-features = ["test-harness"]

[features]
# GUI test harness (TEST §2.1): never in release builds (T-SEC-004).
test-harness = ["nikomiru-ui/test_harness"]

[dependencies]
nikomiru-core.workspace = true
nikomiru-dict.workspace = true
nikomiru-library.workspace = true
nikomiru-media.workspace = true
nikomiru-player.workspace = true
nikomiru-subs.workspace = true
nikomiru-ui.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
